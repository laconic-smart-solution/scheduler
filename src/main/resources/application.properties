spring.application.name=scheduler
server.port=${SCHEDULER_PORT:8010}

# Oracle (LCN_SCHEDULER) — override via .env / environment
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//192.168.0.131:1521/LACONIC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:LCN_SCHEDULER}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:LCN_SCHEDULER}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# No Flyway — Hibernate manages schema for this service
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

scheduler.engine.batch-size=${SCHEDULER_ENGINE_BATCH_SIZE:50}

# Feature 6 — outbound webhook HTTP
scheduler.webhook.connect-timeout-ms=${SCHEDULER_WEBHOOK_CONNECT_TIMEOUT_MS:3000}
scheduler.webhook.response-timeout-ms=${SCHEDULER_WEBHOOK_RESPONSE_TIMEOUT_MS:10000}

# Feature 4 — single Quartz poll wake (not per-schedule triggers)
scheduler.poll.enabled=${SCHEDULER_POLL_ENABLED:true}
scheduler.poll.interval-ms=${SCHEDULER_POLL_INTERVAL_MS:5000}

# In-memory Quartz job store is enough (one poll job only)
spring.quartz.job-store-type=memory
spring.quartz.overwrite-existing-jobs=true

# Disable Spring Batch auto job launch
spring.batch.job.enabled=false

# Defer Redis / Mail / Batch auto-config (Quartz enabled for Feature 4)
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,\
org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
