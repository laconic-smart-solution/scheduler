spring.application.name=scheduler
server.port=${SCHEDULER_PORT:8010}

# Oracle — set via .env / environment for real runs.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:scheduler}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:scheduler}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Schema owned by Flyway; Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Defer Redis/Mail/Batch/Quartz until later features wire them (Boot 4 FQCN).
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,\
org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration,\
org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
