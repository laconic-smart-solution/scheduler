spring.application.name=scheduler
server.port=${SCHEDULER_PORT:8010}

# Oracle (LCN_SCHEDULER) — override via .env / environment
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//192.168.0.131:1521/LACONIC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:LCN_SCHEDULER}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:LCN_SCHEDULER}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# No Flyway — Hibernate manages schema for this service
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

scheduler.engine.batch-size=${SCHEDULER_ENGINE_BATCH_SIZE:50}

# Defer Redis/Mail/Batch/Quartz until later features
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,\
org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration,\
org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
